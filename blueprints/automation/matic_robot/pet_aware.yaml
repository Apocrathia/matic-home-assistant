blueprint:
  name: 'Matic: Clean after pets leave'
  description: >-
    Waits until a pet presence sensor has been clear for a time you set, then
    runs a saved Matic plan. Also turn on the pet-waste avoidance switch for an
    extra safeguard on the robot.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/pet_aware.yaml
  input:
    vacuum:
      name: Robot
      description: The robot to clean.
      selector:
        entity:
          integration: matic_robot
          domain: vacuum
    pet_presence:
      name: Pet presence sensor
      description: The sensor that is on while a pet is in the area, for example a pet door or camera sensor.
      selector:
        entity:
          domain: binary_sensor
    plan:
      name: Plan
      description: Name of a plan saved in Matic Map, for example Main floor.
      selector:
        text:
    clear_time:
      name: Clear time before cleaning
      description: How long the sensor must stay clear before cleaning starts. Default 10 minutes; for example 30 minutes for a pet that comes and goes.
      default:
        minutes: 10
      selector:
        duration:

mode: single

triggers:
  - trigger: state
    entity_id: !input pet_presence
    to: "off"
    for: !input clear_time

conditions:
  - condition: state
    entity_id: !input pet_presence
    state: "off"

actions:
  - action: matic_robot.intelligent_clean
    target:
      entity_id: !input vacuum
    data:
      plan: !input plan
