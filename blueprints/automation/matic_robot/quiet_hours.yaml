blueprint:
  name: 'Matic: Clean during quiet hours'
  description: >-
    Starts a saved plan at a time you choose, but only if the robot's battery
    is above a level you set (40% by default). Use Quick coverage for rooms
    where a shorter overnight run is preferred.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/quiet_hours.yaml
  input:
    vacuum:
      name: Robot
      description: The robot to clean.
      selector:
        entity:
          integration: matic_robot
          domain: vacuum
    battery:
      name: Battery sensor
      description: Pick the robot's battery level sensor.
      selector:
        entity:
          integration: matic_robot
          domain: sensor
          device_class: battery
    plan:
      name: Plan
      description: Name of a plan saved in Matic Map, for example Main floor.
      selector:
        text:
    run_time:
      name: Start time
      description: The time of day the plan starts.
      default: "01:00:00"
      selector:
        time:
    minimum_battery:
      name: Minimum battery
      description: Skip cleaning when the battery is at or below this level.
      default: 40
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"

mode: single

triggers:
  - trigger: time
    at: !input run_time

conditions:
  - condition: numeric_state
    entity_id: !input battery
    above: !input minimum_battery

actions:
  - action: matic_robot.intelligent_clean
    target:
      entity_id: !input vacuum
    data:
      plan: !input plan
