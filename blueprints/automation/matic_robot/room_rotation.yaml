blueprint:
  name: 'Matic: Clean on a schedule'
  description: >-
    Starts with the rooms that have waited longest since a successful clean,
    then continues through the saved plan. Rooms that failed, were cancelled, or
    were interrupted stay due.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/room_rotation.yaml
  input:
    vacuum:
      name: Robot
      description: The robot to clean.
      selector:
        entity:
          integration: matic_robot
          domain: vacuum
    plan:
      name: Plan
      description: Name of a plan saved in Matic Map, for example Main floor.
      selector:
        text:
    run_time:
      name: Start time
      description: The time of day the plan starts.
      default: "10:00:00"
      selector:
        time:

mode: single

triggers:
  - trigger: time
    at: !input run_time

actions:
  - action: matic_robot.intelligent_clean
    target:
      entity_id: !input vacuum
    data:
      plan: !input plan
