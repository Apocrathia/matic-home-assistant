blueprint:
  name: 'Matic: Clean when everyone leaves'
  description: >-
    Starts a cleaning plan after everyone leaves. Rooms that have waited
    longest are cleaned first, so short trips don't keep cleaning the first
    rooms in the plan. It starts only when the robot is docked or idle, so it
    never replaces a clean already underway. When anyone comes home, it stops
    the plan and sends the robot to its dock; a room that was interrupted stays
    due for next time.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/clean_when_away.yaml
  input:
    vacuum:
      name: Robot
      description: The robot to clean.
      selector:
        entity:
          integration: matic_robot
          domain: vacuum
    household:
      name: Household members
      description: Pick the people whose absence should start cleaning.
      selector:
        entity:
          domain: person
          multiple: true
    plan:
      name: Plan
      description: Name of a plan saved in Matic Map, for example Main floor.
      selector:
        text:
    settle_time:
      name: Delay before cleaning
      description: How long everyone must be away before cleaning starts.
      default:
        minutes: 5
      selector:
        duration:

mode: parallel
max: 2
max_exceeded: silent

variables:
  household_entities: !input household
  vacuum_entity: !input vacuum

triggers:
  - trigger: state
    id: everyone_left
    entity_id: !input household
    to: not_home
    for: !input settle_time
  - trigger: state
    id: someone_returned
    entity_id: !input household
    to: home

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: everyone_left
          - condition: template
            value_template: >-
              {{ expand(household_entities)
                 | rejectattr('state', 'eq', 'not_home') | list | count == 0 }}
          - condition: template
            value_template: "{{ states(vacuum_entity) in ('docked', 'idle') }}"
        sequence:
          - action: matic_robot.intelligent_clean
            target:
              entity_id: !input vacuum
            data:
              plan: !input plan
      - conditions:
          - condition: trigger
            id: someone_returned
        sequence:
          - action: matic_robot.stop_intelligent_cleaning
            continue_on_error: true
            target:
              entity_id: !input vacuum
