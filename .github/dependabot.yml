version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # Pinned to the exact version Home Assistant core ships.
      - dependency-name: PyTurboJPEG
